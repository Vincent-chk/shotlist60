name: audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 审计器自测
        run: python -m unittest discover -s tests -v
      - name: 复验仓库里记录的全部分镜（不需要 API Key）
        run: python audit_all.py
